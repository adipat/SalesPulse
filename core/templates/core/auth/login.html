{% extends 'core/base.html' %}

{% block title %}Login | E-Commerce Sales Analytics{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4 shadow-sm border-0">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock-fill text-primary" style="font-size: 2.5rem;"></i>
                <h4 class="fw-bold mt-2">Sign In</h4>
                <p class="text-muted small">Access your Sales Analytics System</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary">Log In</button>
                </div>
            </form>

            <div class="text-center mt-3 pt-3 border-top">
                <p class="small text-muted mb-0">Don't have an account? <a href="{% url 'core:register' %}" class="fw-semibold text-primary">Register here</a></p>
                <div class="alert alert-secondary py-1 px-2 mt-3 small text-muted text-start" style="font-size: 0.78rem;">
                    <strong>Default Admin:</strong> <code>admin</code> / <code>admin123</code>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
