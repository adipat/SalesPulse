{% extends 'core/base.html' %}

{% block title %}Confirm Deletion | E-Commerce Sales Analytics{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4 shadow-sm border-0 text-center">
            <div class="mb-3">
                <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 3rem;"></i>
            </div>
            <h4 class="fw-bold mb-2">Are you sure?</h4>
            <p class="text-muted mb-4">
                You are about to permanently delete <strong>{{ object }}</strong> ({{ type }}). This action cannot be undone.
            </p>

            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2">
                    <a href="{% url cancel_url %}" class="btn btn-light px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
