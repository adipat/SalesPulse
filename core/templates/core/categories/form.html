{% extends 'core/base.html' %}

{% block title %}{{ title }} | E-Commerce Sales Analytics{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4 shadow-sm">
            <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                <h4 class="fw-bold mb-0">{{ title }}</h4>
                <a href="{% url 'core:category_list' %}" class="btn btn-sm btn-outline-secondary">
                    &larr; Back to Categories
                </a>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label small fw-semibold">Category Name</label>
                    {{ form.name }}
                    {% if form.name.errors %}<div class="text-danger small">{{ form.name.errors.0 }}</div>{% endif %}
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'core:category_list' %}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Category</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
